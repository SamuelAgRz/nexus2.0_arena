- id: 39
  question: Calculate the channel mix variation for Mexico, Colombia, and Brazil by
    comparing YTD 2025 against the prior year (PY). Break down the results by country.
  dax_query: |
    EVALUATE
    SUMMARIZECOLUMNS(
        'Ship From'[L1.5 - Country],
        'Channel'[LT1.2 - Channel Group],

        FILTER(ALL('Ship From'[L1.5 - Country]), 'Ship From'[L1.5 - Country] IN {"Mexico", "Colombia", "Brazil"}),
        FILTER(ALL('Period'[Year 445 Code]), 'Period'[Year 445 Code] = "2025"),
        FILTER(ALL('Reporting View'[Reporting View]), 'Reporting View'[Reporting View] = "Operational View"),
        FILTER(ALL('Sales Type'[Primary Sales Indicator]), 'Sales Type'[Primary Sales Indicator] = "Y"),
        FILTER(ALL('Transaction Type'[Transaction Type]), 'Transaction Type'[Transaction Type] = "Actuals"),
        FILTER(ALL('Product'[Non-KO Product]), 'Product'[Non-KO Product] <> "Y"),
        FILTER(ALL('Product'[LT1.7 - Segment]), 'Product'[LT1.7 - Segment] <> "GV Brands"),

        "Unit Cases", [Unit Cases AC],
        "Unit Cases PY", [Unit Cases AC PY],

        "Share",
            DIVIDE(
                [Unit Cases AC],
                CALCULATE(
                    [Unit Cases AC],
                    ALL('Channel'[LT1.2 - Channel Group])
                )
            ),

        "Share PY",
            DIVIDE(
                [Unit Cases AC PY],
                CALCULATE(
                    [Unit Cases AC PY],
                    ALL('Channel'[LT1.2 - Channel Group])
                )
            ),

        "Channel Mix Variation vs PY",
            DIVIDE(
                [Unit Cases AC],
                CALCULATE(
                    [Unit Cases AC],
                    ALL('Channel'[LT1.2 - Channel Group])
                )
            )
            -
            DIVIDE(
                [Unit Cases AC PY],
                CALCULATE(
                    [Unit Cases AC PY],
                    ALL('Channel'[LT1.2 - Channel Group])
                )
            )
    )

    ORDER BY
        'Ship From'[L1.5 - Country],
        [Channel Mix Variation vs PY] DESC
