- id: 1
  question: Give me the Unit Cases and Net Sales Revenue for Mexico, Colombia and Brazil in 2026.
  dax_query: |
    EVALUATE
    ADDCOLUMNS(
        FILTER(
            ALL('Ship From'[L1.5 - Country]),
            'Ship From'[L1.5 - Country] IN { "Colombia", "Mexico", "Brazil" }
        ),
        "Unit Cases YTD",
        CALCULATE(
            [Unit Cases AC YTD],
            KEEPFILTERS(FILTER(ALL('Reporting View'[Reporting View]), 'Reporting View'[Reporting View] = "Operational View")),
            KEEPFILTERS(FILTER(ALL('Period'[Year 445 Code]), 'Period'[Year 445 Code] = "2026")),
            KEEPFILTERS(FILTER(ALL('Period'[Month 445]), 'Period'[Month 445] <> "")),
            KEEPFILTERS(FILTER(ALL('Transaction Type'[Transaction Type]), 'Transaction Type'[Transaction Type] = "Actuals")),
            KEEPFILTERS(FILTER(ALL('Sales Type'[Primary Sales Indicator]), 'Sales Type'[Primary Sales Indicator] = "Y")),
            KEEPFILTERS(FILTER(ALL('Product'[Non-KO Product]), 'Product'[Non-KO Product] <> "Y")),
            KEEPFILTERS(FILTER(ALL('Product'[LT1.7 - Segment]), 'Product'[LT1.7 - Segment] <> "GV Brands"))
        ),
        "Net Sales Revenue YTD",
        CALCULATE(
            [Bottler Net Revenue AC (LC) YTD],
            KEEPFILTERS(FILTER(ALL('Reporting View'[Reporting View]), 'Reporting View'[Reporting View] = "Operational View")),
            KEEPFILTERS(FILTER(ALL('Period'[Year 445 Code]), 'Period'[Year 445 Code] = "2026")),
            KEEPFILTERS(FILTER(ALL('Period'[Month 445]), 'Period'[Month 445] <> "")),
            KEEPFILTERS(FILTER(ALL('Transaction Type'[Transaction Type]), 'Transaction Type'[Transaction Type] = "Actuals")),
            KEEPFILTERS(FILTER(ALL('Sales Type'[Primary Sales Indicator]), 'Sales Type'[Primary Sales Indicator] = "Y")),
            KEEPFILTERS(FILTER(ALL('Product'[Non-KO Product]), 'Product'[Non-KO Product] <> "Y")),
            KEEPFILTERS(FILTER(ALL('Product'[LT1.7 - Segment]), 'Product'[LT1.7 - Segment] <> "GV Brands"))
        )
    )
    ORDER BY 'Ship From'[L1.5 - Country] ASC

- id: 2
  question: Within FEMSA's Walmart business in Mexico, rank categories by volume from Jan to May 2026 — highest to lowest.
  dax_query: |
    EVALUATE
    SUMMARIZECOLUMNS(
        'Product'[LT1.5 - Category],
        FILTER(ALL('Ship From'[L1.5 - Country]), 'Ship From'[L1.5 - Country] = "Mexico"),
        FILTER(ALL('Ship From'[L1.3 - Bottler]), 'Ship From'[L1.3 - Bottler] IN { "MX Coca-Cola Femsa" }),
        FILTER(ALL('Ship To'[LT1.2 - Customer]), 'Ship To'[LT1.2 - Customer] IN { "Wal-Mart Inc." }),
        FILTER(ALL('Period'[Month 445 Code]), 'Period'[Month 445 Code] >= "202601" && 'Period'[Month 445 Code] <= "202605"),
        FILTER(ALL('Reporting View'[Reporting View]), 'Reporting View'[Reporting View] = "Operational View"),
        FILTER(ALL('Sales Type'[Primary Sales Indicator]), 'Sales Type'[Primary Sales Indicator] = "Y"),
        FILTER(ALL('Transaction Type'[Transaction Type]), 'Transaction Type'[Transaction Type] = "Actuals"),
        FILTER(ALL('Product'[Non-KO Product]), 'Product'[Non-KO Product] <> "Y"),
        FILTER(ALL('Product'[LT1.7 - Segment]), 'Product'[LT1.7 - Segment] <> "GV Brands"),
        "Unit Cases", [Unit Cases AC]
    )
    ORDER BY [Unit Cases] DESC

