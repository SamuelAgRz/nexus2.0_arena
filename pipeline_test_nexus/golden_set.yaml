- id: 21
  question: Give me monthly Unit Cases for Arca Continental and Bepensa in Mexico
    in 2026, for brand group Coca-Cola.
  dax_query: |
    EVALUATE
    SUMMARIZECOLUMNS(
        'Period'[Month 445],
        'Period'[Month 445 Code],
        FILTER(ALL('Ship From'[L1.5 - Country]), 'Ship From'[L1.5 - Country] = "Mexico"),
        FILTER(ALL('Ship From'[L1.3 - Bottler]), 'Ship From'[L1.3 - Bottler] IN { "MX Arca Continental", "MX Bepensa" }),
        FILTER(ALL('Product'[LT1.2 - Brand Group]), 'Product'[LT1.2 - Brand Group] = "Coca-Cola"),
        FILTER(ALL('Period'[Month 445 Code]), 'Period'[Month 445 Code] >= "202601" && 'Period'[Month 445 Code] <= "202612"),
        FILTER(ALL('Reporting View'[Reporting View]), 'Reporting View'[Reporting View] = "Operational View"),
        FILTER(ALL('Transaction Type'[Transaction Type]), 'Transaction Type'[Transaction Type] = "Actuals"),
        FILTER(ALL('Sales Type'[Primary Sales Indicator]), 'Sales Type'[Primary Sales Indicator] = "Y"),
        FILTER(ALL('Product'[Non-KO Product]), 'Product'[Non-KO Product] <> "Y"),
        FILTER(ALL('Product'[LT1.7 - Segment]), 'Product'[LT1.7 - Segment] <> "GV Brands"),
        "Unit Cases", [Unit Cases AC]
    )
    ORDER BY 'Period'[Month 445 Code] ASC
- id: 22
  question: Compare Chedraui sales by bottler, Q1 2025 vs Q1 2026, in volume for Powerade.
  dax_query: |
    EVALUATE
    ADDCOLUMNS(
        CALCULATETABLE(
            VALUES('Ship From'[L1.3 - Bottler]),
            'Ship From'[L1.5 - Country] = "Mexico"
        ),
        "Q1 2026 Unit Cases",
        CALCULATE(
            [Unit Cases AC QTD],
            KEEPFILTERS(FILTER(ALL('Ship To'[LT1.2 - Customer]), 'Ship To'[LT1.2 - Customer] = "Chedraui")),
            KEEPFILTERS(FILTER(ALL('Product'[LT1.2 - Brand Group]), 'Product'[LT1.2 - Brand Group] = "Powerade")),
            KEEPFILTERS(FILTER(ALL('Period'[Quarter 445 Code]), 'Period'[Quarter 445 Code] = "202601")),
            KEEPFILTERS(FILTER(ALL('Period'[Month 445]), 'Period'[Month 445] <> "")),
            KEEPFILTERS(FILTER(ALL('Reporting View'[Reporting View]), 'Reporting View'[Reporting View] = "Operational View")),
            KEEPFILTERS(FILTER(ALL('Transaction Type'[Transaction Type]), 'Transaction Type'[Transaction Type] = "Actuals")),
            KEEPFILTERS(FILTER(ALL('Sales Type'[Primary Sales Indicator]), 'Sales Type'[Primary Sales Indicator] = "Y")),
            KEEPFILTERS(FILTER(ALL('Product'[Non-KO Product]), 'Product'[Non-KO Product] <> "Y")),
            KEEPFILTERS(FILTER(ALL('Product'[LT1.7 - Segment]), 'Product'[LT1.7 - Segment] <> "GV Brands"))
        ),
        "Q1 2025 Unit Cases",
        CALCULATE(
            [Unit Cases AC QTD],
            KEEPFILTERS(FILTER(ALL('Ship To'[LT1.2 - Customer]), 'Ship To'[LT1.2 - Customer] = "Chedraui")),
            KEEPFILTERS(FILTER(ALL('Product'[LT1.2 - Brand Group]), 'Product'[LT1.2 - Brand Group] = "Powerade")),
            KEEPFILTERS(FILTER(ALL('Period'[Quarter 445 Code]), 'Period'[Quarter 445 Code] = "202501")),
            KEEPFILTERS(FILTER(ALL('Period'[Month 445]), 'Period'[Month 445] <> "")),
            KEEPFILTERS(FILTER(ALL('Reporting View'[Reporting View]), 'Reporting View'[Reporting View] = "Operational View")),
            KEEPFILTERS(FILTER(ALL('Transaction Type'[Transaction Type]), 'Transaction Type'[Transaction Type] = "Actuals")),
            KEEPFILTERS(FILTER(ALL('Sales Type'[Primary Sales Indicator]), 'Sales Type'[Primary Sales Indicator] = "Y")),
            KEEPFILTERS(FILTER(ALL('Product'[Non-KO Product]), 'Product'[Non-KO Product] <> "Y")),
            KEEPFILTERS(FILTER(ALL('Product'[LT1.7 - Segment]), 'Product'[LT1.7 - Segment] <> "GV Brands"))
        )
    )
    ORDER BY [Q1 2026 Unit Cases] DESC
- id: 23
